<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TETRIS — Gem Edition</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1 class="logo">TETRIS</h1>
      <p class="tagline">GEM EDITION — SINGLE PLAYER</p>
    </header>

    <main class="layout">
      <div class="board-panel">
        <canvas id="boardCanvas" width="260" height="520"></canvas>
        <div id="pauseOverlay" class="overlay hidden">
          <div class="overlay-title">PAUSED</div>
          <div class="overlay-hint">PRESS P TO RESUME</div>
        </div>
        <div id="gameOverOverlay" class="overlay hidden">
          <div class="overlay-title over">GAME OVER</div>
          <div class="overlay-score">SCORE <span id="finalScore">0</span></div>
          <button id="restartBtn" class="btn-primary">PLAY AGAIN</button>
        </div>
      </div>

      <aside class="side-panel">
        <section class="panel">
          <h2 class="panel-header">NEXT</h2>
          <canvas id="nextCanvas" width="120" height="76"></canvas>
        </section>

        <section class="panel">
          <h2 class="panel-header">HOLD</h2>
          <canvas id="holdCanvas" width="120" height="76"></canvas>
        </section>

        <section class="panel">
          <h2 class="panel-header">STATS</h2>
          <div class="stat-row full">
            <span class="stat-label">SCORE</span>
            <span class="stat-value" id="scoreValue">0</span>
          </div>
          <div class="stat-row split">
            <div>
              <span class="stat-label">LEVEL</span>
              <div class="stat-value" id="levelValue">1</div>
            </div>
            <div>
              <span class="stat-label">LINES</span>
              <div class="stat-value" id="linesValue">0</div>
            </div>
          </div>
        </section>

        <section class="panel">
          <h2 class="panel-header">CONTROLS</h2>
          <div class="control-row"><span class="key">← →</span><span>Move</span></div>
          <div class="control-row"><span class="key">↓</span><span>Soft Drop</span></div>
          <div class="control-row"><span class="key">↑</span><span>Rotate</span></div>
          <div class="control-row"><span class="key">SPACE</span><span>Hard Drop</span></div>
          <div class="control-row"><span class="key">C</span><span>Hold</span></div>
          <div class="control-row"><span class="key">P</span><span>Pause</span></div>
        </section>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
